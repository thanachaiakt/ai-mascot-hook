name: Release

# Push a tag like v0.2.0 to build both platforms and publish a GitHub release.
# Run it by hand (Actions > Release > Run workflow) to build the files without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Version
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: cargo test --release
      - run: cargo build --release

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /DAppVersion=${{ steps.version.outputs.version }} installer\windows.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive target\release\ai-mascot-hook.exe target\installer\ai-mascot-hook-${{ steps.version.outputs.version }}-windows-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: target/installer/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - run: cargo test --release

      - name: Universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          name=ai-mascot-hook-$version-macos
          mkdir -p dist/$name
          lipo -create -output dist/$name/ai-mascot-hook \
            target/aarch64-apple-darwin/release/ai-mascot-hook \
            target/x86_64-apple-darwin/release/ai-mascot-hook
          # Apple silicon refuses to run a binary with no signature at all; ad hoc is enough
          codesign --force --sign - dist/$name/ai-mascot-hook
          cp tools/install-mac.sh dist/$name/install.sh
          chmod +x dist/$name/install.sh dist/$name/ai-mascot-hook
          tar -C dist -czf dist/$name.tar.gz $name

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
